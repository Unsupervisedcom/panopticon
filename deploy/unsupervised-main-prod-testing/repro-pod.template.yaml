# Template: a finder repro/test pod an agent provisions in finder-repro.
# Runs as `finder-test` (IRSA -> read-only prod S3 exports). The agent kubectl-cp's the
# binary it built (build-finder-in-pod.sh) into the pod, then execs it against a config
# that points at real S3 export URIs. Size within the ResourceQuota ceiling.
#
# The agent fills: <POD>, memory/cpu, and the finder config (feature_ids/file_locations
# pointing at s3://unsupervised-prod-internal/internal/... exports the operator staged).
apiVersion: v1
kind: Pod
metadata:
  name: <POD>            # e.g. finder-repro-<runId>
  namespace: finder-repro
  labels:
    app.kubernetes.io/managed-by: panopticon
    purpose: finder-repro
spec:
  restartPolicy: Never
  serviceAccountName: finder-test           # IRSA: read-only prod S3 exports
  imagePullSecrets:
    - name: unsupervised-regcred            # Harbor pull (copied into finder-repro)
  containers:
    - name: finder
      # A base image just to hold/exec the cp'd binary; the binary is self-contained
      # (PyInstaller). Any image with a shell works; reuse the prod image for parity.
      image: harbor.unsupervised.com/images/unsupervised-main:latest
      command: ["sleep", "36000"]
      env:
        - { name: FINDER_INPUT_DATA_MEMORY_BUDGET_GB, value: "200" }
        - { name: TMPDIR, value: "/scratch" }
        - { name: FINDER_WORKERS, value: "52" }
      resources:
        # Stay under the LimitRange max (64 CPU / 300Gi mem / 500Gi ephemeral).
        requests: { cpu: "16", memory: 200Gi }
        limits:   { cpu: "32", memory: 256Gi }
      volumeMounts:
        - { name: scratch, mountPath: /scratch }
  volumes:
    - name: scratch
      emptyDir: { sizeLimit: 400Gi }
# Agent workflow, once Ready:
#   kubectl -n finder-repro cp ./finder <POD>:/scratch/finder
#   kubectl -n finder-repro cp ./cfg.json <POD>:/scratch/cfg.json
#   kubectl -n finder-repro exec <POD> -- bash -lc 'chmod +x /scratch/finder && /scratch/finder -i /scratch/cfg.json'
#   # profile passively: kubectl -n finder-repro exec <POD> -- cat /sys/fs/cgroup/cpu.stat
