# Template: a finder repro/test pod an agent provisions.
#
# INTERIM (broad role): runs in `default` as `unsupervised-unsupervised` — the existing
# prod-unsupervised-main IRSA role, so it can read prod S3 exports. No new cluster objects.
# PHASE 2 (scoped, needs IAM-admin): namespace: finder-repro, serviceAccountName: finder-test.
#
# NOTE: `default` has no ResourceQuota, so nothing but the operator turn-handoff gate bounds
# this in the interim. Keep pod sizes explicit (below) and ALWAYS delete pods when done.
#
# The agent fills: <POD>, memory/cpu, and the finder config (feature_ids/file_locations
# pointing at s3://unsupervised-prod-internal/internal/... exports the operator staged).
apiVersion: v1
kind: Pod
metadata:
  name: <POD>            # e.g. finder-repro-<runId>
  namespace: default
  labels:
    app.kubernetes.io/managed-by: panopticon
    purpose: finder-repro
spec:
  restartPolicy: Never
  serviceAccountName: unsupervised-unsupervised   # broad IRSA -> prod S3 exports (interim)
  imagePullSecrets:
    - name: unsupervised-regcred                  # Harbor pull (already in default)
  containers:
    - name: finder
      # A base image just to hold/exec the cp'd binary; the binary is self-contained
      # (PyInstaller). Reuse the prod image for parity.
      image: harbor.unsupervised.com/images/unsupervised-main:latest
      command: ["sleep", "36000"]
      env:
        - { name: FINDER_INPUT_DATA_MEMORY_BUDGET_GB, value: "200" }
        - { name: TMPDIR, value: "/scratch" }
        - { name: FINDER_WORKERS, value: "52" }
      resources:
        # Keep these explicit — in `default` there is no quota to clamp a runaway pod.
        requests: { cpu: "16", memory: 200Gi }
        limits:   { cpu: "32", memory: 256Gi }
      volumeMounts:
        - { name: scratch, mountPath: /scratch }
  volumes:
    - name: scratch
      emptyDir: { sizeLimit: 400Gi }
# Agent workflow, once Ready:
#   kubectl -n default cp ./finder <POD>:/scratch/finder
#   kubectl -n default cp ./cfg.json <POD>:/scratch/cfg.json
#   kubectl -n default exec <POD> -- bash -lc 'chmod +x /scratch/finder && /scratch/finder -i /scratch/cfg.json'
#   # profile passively: kubectl -n default exec <POD> -- cat /sys/fs/cgroup/cpu.stat
#   kubectl -n default delete pod <POD>   # ALWAYS clean up
